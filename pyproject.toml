[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgnn"
version = "0.1.0"
description = "Coordinated attack campaign detection on VM backup telemetry with a dual-stream graph neural network"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Nilesh Barge" }]
dependencies = [
    "networkx>=3.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "torch>=2.2",
    "torch_geometric>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.8",
]

[project.scripts]
cadgnn = "cadgnn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    # Raised inside torch_geometric's own imports, nothing to fix on our side.
    "ignore:`torch.jit.script` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The notebook is kept byte-for-byte as the reference for the generator port.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
